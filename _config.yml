lang: ko
timezone: Asia/Seoul
title: "ba2slk's Blog"
url: "https://ba2slk.github.io"
baseurl: ""
author: ba2slk

links:
  github: https://github.com/ba2slk

permalink: /posts/:title/

kramdown:
  input: GFM
  hard_wrap: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  books:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      type: posts
    values:
      layout: post

exclude:
  - docs
  - tools
  - .superpowers
  - vendor
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
