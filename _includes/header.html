<header class="site-header">
  {%- if page.layout == 'home' %}
  <span></span>{%- comment -%} the home hero already carries the signature {%- endcomment -%}
  {%- else %}
  <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}"><img class="logo-mark" src="{{ '/assets/img/signature.webp' | relative_url }}" alt="" width="640" height="182"></a>
  {%- endif %}
  <nav class="site-nav">
    <div class="nav-links">
      <a href="{{ '/articles/' | relative_url }}">Articles</a>
      <a href="{{ '/books/' | relative_url }}">Books</a>
      <a href="{{ '/timeline/' | relative_url }}">Timeline</a>
    </div>
    <details class="menu">
      <summary aria-label="Menu">☰</summary>
      <div class="menu-panel">
        <a href="{{ '/articles/' | relative_url }}">Articles</a>
        <a href="{{ '/books/' | relative_url }}">Books</a>
        <a href="{{ '/timeline/' | relative_url }}">Timeline</a>
      </div>
    </details>
    <button type="button" class="search-btn" id="search-open" aria-label="Search"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </nav>
</header>
