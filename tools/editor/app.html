<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor · ba2slk</title>
<script>
  (function () {
    try {
      var w = Number(localStorage.getItem('side-w'));
      if (w) document.documentElement.style.setProperty('--side-w', w + 'px');
      if (localStorage.getItem('side-folded') === '1') document.documentElement.classList.add('side-folded');
    } catch (e) {}
  })();
</script>
<link rel="icon" type="image/png" href="/editor/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/prose.css">
<link rel="stylesheet" href="/assets/css/syntax.css">
<link rel="stylesheet" href="/editor/app.css">
<script src="/assets/js/copy-code.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>
<body>
<div class="app" id="app" data-tab="write">

  <header class="bar">
    <button class="icon-btn" id="drawer-btn" aria-label="Toggle post list" title="Toggle post list (Ctrl+\)">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <span class="logo">ba2slk <small>editor</small></span>
    <nav class="tabs only-mobile" role="tablist">
      <button role="tab" data-tab="write" aria-selected="true">Write</button>
      <button role="tab" data-tab="preview" aria-selected="false">Preview</button>
    </nav>
    <span class="status" id="status" aria-live="polite"></span>
    <div class="view-toggles">
      <button class="link-btn" id="raw-btn" aria-pressed="false" title="Show raw markdown (Ctrl+E)">Raw</button>
      <button class="link-btn not-mobile" id="preview-btn" aria-pressed="false" title="Show the preview pane">Preview</button>
    </div>
    <div class="actions-bar">
      <button class="link-btn" id="archive" hidden>Archive</button>
      <button class="link-btn" id="restore" hidden>Restore</button>
      <button class="link-btn danger" id="delete" hidden>Delete</button>
      <button class="btn primary" id="publish" hidden>Publish</button>
    </div>
  </header>

  <aside class="side" id="side">
    <input class="filter" id="filter" type="search" placeholder="Filter">
    <div class="new">
      <button class="link-btn" id="new-article">+ Article</button>
      <button class="link-btn" id="new-note">+ Book note</button>
    </div>
    <h2>DRAFTS</h2>
    <ul class="list" id="drafts"></ul>
    <h2>ARTICLES</h2>
    <ul class="list" id="articles"></ul>
    <h2 class="with-action">BOOKS <button type="button" class="link-btn small" id="toggle-books">Collapse all</button></h2>
    <div id="books"></div>
    <h2>ARCHIVED</h2>
    <ul class="list" id="archived"></ul>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize post list" tabindex="0"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="write" id="write">
    <div class="empty" id="empty">
      <p>Pick a post on the left, or start a new one.</p>
      <div class="new"><button class="btn" id="empty-article">+ Article</button><button class="btn" id="empty-note">+ Book note</button></div>
    </div>
    <div class="doc" id="doc" hidden>
      <div class="conflict" id="conflict" hidden>
        <span>This file changed outside the editor.</span>
        <button class="link-btn" id="reload">Reload</button>
        <button class="link-btn" id="overwrite">Keep mine</button>
      </div>
      <input class="title-input" id="f-title" placeholder="Title" autocomplete="off">
      <div class="fields">
        <label><span>slug</span><input id="f-slug" class="mono" placeholder="ch06-cache" autocomplete="off" spellcheck="false"></label>
        <label class="note-only"><span>book</span><select id="f-book"></select><button type="button" class="link-btn small" id="edit-book">edit</button></label>
        <label class="note-only"><span>chapter</span><input id="f-chapter" type="number" min="1" class="mono"></label>
        <label class="article-only"><span>thumbnail</span><select id="f-image"><option value="">None</option></select></label>
      </div>
      <div id="src"></div>
    </div>
  </section>

  <section class="preview" id="preview">
    <div class="preview-inner">
      <header class="post-head"><h1 id="p-title"></h1><div class="meta" id="p-meta"></div></header>
      <article class="prose" id="p-body"></article>
    </div>
  </section>
</div>

<dialog id="book-dialog">
  <form method="dialog" id="book-form">
    <h2 id="book-dialog-title">New book</h2>
    <label><span>title</span><input name="title" required></label>
    <label><span>id</span><input name="slug" class="mono" placeholder="clean-code" required></label>
    <label><span>author</span><input name="author"></label>
    <label><span>publisher</span><input name="publisher"></label>
    <div class="drop" id="cover-drop" tabindex="0">
      <img id="cover-preview" alt="" hidden>
      <span id="cover-hint">Paste or drop a cover image (optional)</span>
    </div>
    <p class="error" id="book-error" hidden></p>
    <div class="actions">
      <span class="book-manage">
        <button type="button" class="link-btn" id="archive-book" hidden>Archive book</button>
        <button type="button" class="link-btn" id="restore-book" hidden>Restore book</button>
        <button type="button" class="link-btn danger" id="delete-book" hidden>Delete</button>
      </span>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok" id="book-submit">Add book</button>
    </div>
  </form>
</dialog>

<script src="/editor/lib.js"></script>
<script type="module" src="/editor/app.js"></script>
</body>
</html>
